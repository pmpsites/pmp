<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
:root{
/* --box-height: 4rem; */
--box-height: clamp(1rem, -24.0435rem + 53.2174vw, 100rem)
}
.pmpholder {
    display: grid;
    max-width: fit-content;
    grid-template-columns: calc(var(--box-height)/4)  auto calc(var(--box-height)/4) ;
    grid-template-rows: calc(var(--box-height)/4)  1fr auto;
    font-size: calc(0.5625*var(--box-height));
    font-family: sans-serif;
    font-weight:900;
    line-height: 1;
    margin-top: 2rem;
}
.words { 
    grid-area: 1 / 2 / 4 / 3 ; 
    z-index: 999; 
    & span{
        display:block;
        max-width:max-content;
        background-color: #fff;
        padding: 0 calc(var(--box-height)*0.1875);
    }    
}
.brackets { 
    grid-area: 2 / 1 / 3 / 4; 
    border: calc(var(--box-height)/8) solid rgb(217, 112, 100); 
    height: var(--box-height);
}

</style>
</head>
<body>
    <div class="pmpholder">
        <div class="words"> <span>Place</span><span>Marketing</span><span>Partners</span></div>
        <div class="brackets"> </div>
    </div>
    <div style="--box-height: 6rem;" class="pmpholder">
        <div class="words"> <span>Influencing</span><span>hearts and</span><span>minds</span></div>
        <div class="brackets"> </div>
    </div>
    <div style="--box-height: 8rem;"class="pmpholder">
        <div class="words"> <span>Persuade</span><span>More</span><span>People</span></div>
        <div class="brackets"> </div>
    </div>
    <div style="--box-height: 12rem;"class="pmpholder">
        <div class="words"> <span>Ingesting</span><span>hubris and</span><span>modesty</span></div>        
        <div class="brackets"> </div>
    </div>
    <div style="--box-height: 16rem;"class="pmpholder">
        <div class="words"> <span>Plural</span><span>Message</span><span>Pain</span></div>
        <div class="brackets"> </div>
    </div>
</body>
</html>
